<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 15px;
      background: #f5f5f5;
      color: #222;
      padding: 2rem;
    }

    h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }

    /* ── Form ── */
    form {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1.25rem;
      max-width: 520px;
      display: grid;
      gap: 0.75rem;
    }

    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    label { font-size: 0.85rem; font-weight: 600; color: #444; }

    input[type="text"],
    input[type="number"],
    select {
      padding: 0.45rem 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
      width: 100%;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus { outline: 2px solid #4a90d9; border-color: transparent; }

    /* ── Rating ── */
    #rating-field { display: none; }
    #rating-field.visible { display: flex; flex-direction: column; gap: 0.3rem; }

    .star-rating { display: flex; gap: 2px; cursor: pointer; user-select: none; }

    .star-rating .star {
      position: relative;
      font-size: 1.8rem;
      line-height: 1;
      color: #ddd;
    }

    .star-rating .star[data-state="full"] { color: #f5a623; }

    .star-rating .star[data-state="half"] {
      background: linear-gradient(to right, #f5a623 50%, #ddd 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Invisible hover zones covering each half of a star */
    .star-rating .zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
    }
    .star-rating .zone.left  { left: 0; }
    .star-rating .zone.right { right: 0; }

    .rating-hint { font-size: 0.8rem; color: #888; }

    /* ── Error ── */
    #error-msg {
      display: none;
      color: #c0392b;
      font-size: 0.85rem;
      background: #fdecea;
      border: 1px solid #f5c6c2;
      border-radius: 4px;
      padding: 0.4rem 0.6rem;
    }
    #error-msg.visible { display: block; }

    /* ── Add button ── */
    button[type="submit"] {
      padding: 0.5rem 1.2rem;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
      justify-self: start;
    }
    button[type="submit"]:disabled {
      background: #b0c8e8;
      cursor: not-allowed;
    }
    button[type="submit"]:not(:disabled):hover { background: #357abd; }

    /* ── Book list ── */
    #list-section { margin-top: 2rem; max-width: 860px; }
    #list-section h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }

    #empty-msg { color: #888; font-size: 0.9rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      padding: 0.6rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }

    th { background: #f9f9f9; font-weight: 600; color: #555; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .status-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .status-want  { background: #e8f0fe; color: #3c5bbb; }
    .status-reading { background: #fef6e4; color: #a05c00; }
    .status-read  { background: #e6f4ea; color: #276a34; }

    .star-display, .star-half, .star-empty { letter-spacing: -0.05em; }
    .star-display { color: #f5a623; }
    .star-half {
      background: linear-gradient(to right, #f5a623 50%, #ddd 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .star-empty { color: #ddd; }
  </style>
</head>
<body>

<h1>Reading Tracker</h1>

<form id="add-form" novalidate>
  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" placeholder="Book title">
  </div>
  <div class="field">
    <label for="author">Author</label>
    <input type="text" id="author" placeholder="Author name">
  </div>
  <div class="field">
    <label for="page-count">Page count</label>
    <input type="number" id="page-count" min="1" placeholder="e.g. 320">
  </div>
  <div class="field">
    <label for="status">Status</label>
    <select id="status">
      <option value="want-to-read">Want to Read</option>
      <option value="reading">Reading</option>
      <option value="read">Read</option>
    </select>
  </div>

  <div class="field" id="rating-field">
    <label>Rating</label>
    <div class="star-rating" id="star-rating"></div>
    <span class="rating-hint">Optional — click a star to rate</span>
  </div>

  <div id="error-msg"></div>

  <button type="submit" id="add-btn" disabled>Add book</button>
</form>

<section id="list-section">
  <h2>My Books</h2>
  <p id="empty-msg">No books added yet.</p>
  <table id="book-table" style="display:none">
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Pages</th>
        <th>Status</th>
        <th>Rating</th>
      </tr>
    </thead>
    <tbody id="book-tbody"></tbody>
  </table>
</section>

<script>
  const STORAGE_KEY = 'books';

  // ── State ──────────────────────────────────────────────────────────────────
  function loadBooks() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveBooks(books) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
  }

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const form       = document.getElementById('add-form');
  const titleInput = document.getElementById('title');
  const authorInput= document.getElementById('author');
  const pagesInput = document.getElementById('page-count');
  const statusSel  = document.getElementById('status');
  const ratingField= document.getElementById('rating-field');
  const addBtn     = document.getElementById('add-btn');
  const errorMsg   = document.getElementById('error-msg');
  const emptyMsg   = document.getElementById('empty-msg');
  const bookTable  = document.getElementById('book-table');
  const bookTbody  = document.getElementById('book-tbody');

  // ── Add-button gate ────────────────────────────────────────────────────────
  function updateAddBtn() {
    const ok = titleInput.value.trim() !== ''
            && authorInput.value.trim() !== ''
            && pagesInput.value.trim() !== ''
            && parseInt(pagesInput.value, 10) >= 1;
    addBtn.disabled = !ok;
  }

  [titleInput, authorInput, pagesInput].forEach(el =>
    el.addEventListener('input', updateAddBtn)
  );

  // ── Star rating widget ─────────────────────────────────────────────────────
  const starContainer = document.getElementById('star-rating');
  let selectedRating = 0;

  // Build 5 stars, each with two invisible half-zones
  for (let i = 1; i <= 5; i++) {
    const star = document.createElement('span');
    star.className = 'star';
    star.textContent = '★';
    star.dataset.state = 'empty';

    const left = document.createElement('span');
    left.className = 'zone left';
    left.dataset.val = String(i - 0.5);

    const right = document.createElement('span');
    right.className = 'zone right';
    right.dataset.val = String(i);

    star.appendChild(left);
    star.appendChild(right);
    starContainer.appendChild(star);
  }

  function highlightStars(rating) {
    starContainer.querySelectorAll('.star').forEach((star, idx) => {
      const n = idx + 1;
      if (rating >= n)         star.dataset.state = 'full';
      else if (rating >= n - 0.5) star.dataset.state = 'half';
      else                     star.dataset.state = 'empty';
    });
  }

  starContainer.addEventListener('mouseover', e => {
    const zone = e.target.closest('.zone');
    if (zone) highlightStars(parseFloat(zone.dataset.val));
  });

  starContainer.addEventListener('mouseleave', () => {
    highlightStars(selectedRating);
  });

  starContainer.addEventListener('click', e => {
    const zone = e.target.closest('.zone');
    if (zone) {
      selectedRating = parseFloat(zone.dataset.val);
      highlightStars(selectedRating);
    }
  });

  function resetStars() {
    selectedRating = 0;
    highlightStars(0);
  }

  // ── Rating visibility ──────────────────────────────────────────────────────
  function syncRatingVisibility() {
    if (statusSel.value === 'read') {
      ratingField.classList.add('visible');
    } else {
      ratingField.classList.remove('visible');
      resetStars();
    }
  }

  statusSel.addEventListener('change', syncRatingVisibility);

  // ── Form submit ────────────────────────────────────────────────────────────
  form.addEventListener('submit', e => {
    e.preventDefault();

    const title  = titleInput.value.trim();
    const author = authorInput.value.trim();
    const pages  = parseInt(pagesInput.value, 10);
    const status = statusSel.value;
    const rating = (status === 'read' && selectedRating > 0) ? selectedRating : null;

    const books = loadBooks();

    // Duplicate check
    const isDuplicate = books.some(b =>
      b.title.toLowerCase() === title.toLowerCase() &&
      b.author.toLowerCase() === author.toLowerCase()
    );

    if (isDuplicate) {
      showError('This book is already in your list.');
      return;
    }

    clearError();
    books.push({ title, author, pageCount: pages, status, rating });
    saveBooks(books);
    renderList(books);
    form.reset();
    resetStars();
    syncRatingVisibility();
    updateAddBtn();
  });

  // ── Error helpers ──────────────────────────────────────────────────────────
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }

  function clearError() {
    errorMsg.textContent = '';
    errorMsg.classList.remove('visible');
  }

  // ── Render list ────────────────────────────────────────────────────────────
  const STATUS_LABELS = {
    'want-to-read': 'Want to Read',
    'reading':      'Reading',
    'read':         'Read',
  };

  const STATUS_CLASSES = {
    'want-to-read': 'status-want',
    'reading':      'status-reading',
    'read':         'status-read',
  };

  function renderStars(rating) {
    if (rating === null) return '—';
    let html = '';
    for (let i = 1; i <= 5; i++) {
      if (rating >= i) {
        html += `<span class="star-display">&#9733;</span>`;
      } else if (rating >= i - 0.5) {
        html += `<span class="star-half">&#9733;</span>`;
      } else {
        html += `<span class="star-empty">&#9733;</span>`;
      }
    }
    return html;
  }

  function renderList(books) {
    if (books.length === 0) {
      emptyMsg.style.display = '';
      bookTable.style.display = 'none';
      return;
    }
    emptyMsg.style.display = 'none';
    bookTable.style.display = '';
    bookTbody.innerHTML = books.map(b => `
      <tr>
        <td>${escHtml(b.title)}</td>
        <td>${escHtml(b.author)}</td>
        <td>${b.pageCount}</td>
        <td><span class="status-badge ${STATUS_CLASSES[b.status]}">${STATUS_LABELS[b.status]}</span></td>
        <td>${renderStars(b.rating)}</td>
      </tr>
    `).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  renderList(loadBooks());
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 15px;
      background: #f5f5f5;
      color: #222;
      padding: 2rem;
    }

    h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }

    /* ── Stats ── */
    #stats-section {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.9rem 1.2rem;
      min-width: 140px;
    }

    .stat-card .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.1;
      color: #222;
    }

    .stat-card .stat-label {
      font-size: 0.78rem;
      color: #888;
      margin-top: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-card.breakdown .stat-value {
      font-size: 0.9rem;
      font-weight: normal;
      color: #444;
      line-height: 1.6;
    }

    /* ── Form ── */
    form {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1.25rem;
      max-width: 520px;
      display: grid;
      gap: 0.75rem;
    }

    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    label { font-size: 0.85rem; font-weight: 600; color: #444; }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select {
      padding: 0.45rem 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
      width: 100%;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    select:focus { outline: 2px solid #4a90d9; border-color: transparent; }

    select:disabled { background: #f0f0f0; color: #999; cursor: not-allowed; }

    .field.hidden { display: none; }

    /* ── Checkbox row ── */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .checkbox-row input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .checkbox-row label {
      font-size: 0.9rem;
      font-weight: normal;
      color: #333;
      cursor: pointer;
    }

    /* ── Rating ── */
    #rating-field { display: none; }
    #rating-field.visible { display: flex; flex-direction: column; gap: 0.3rem; }

    .star-rating { display: flex; gap: 2px; cursor: pointer; user-select: none; }

    .star-rating .star {
      position: relative;
      font-size: 1.8rem;
      line-height: 1;
      color: #ddd;
    }

    .star-rating .star[data-state="full"] { color: #f5a623; }

    .star-rating .star[data-state="half"] {
      background: linear-gradient(to right, #f5a623 50%, #ddd 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .star-rating .zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
    }
    .star-rating .zone.left  { left: 0; }
    .star-rating .zone.right { right: 0; }

    .rating-hint { font-size: 0.8rem; color: #888; }

    /* ── Error ── */
    #error-msg {
      display: none;
      color: #c0392b;
      font-size: 0.85rem;
      background: #fdecea;
      border: 1px solid #f5c6c2;
      border-radius: 4px;
      padding: 0.4rem 0.6rem;
    }
    #error-msg.visible { display: block; }

    /* ── Add button ── */
    button[type="submit"] {
      padding: 0.5rem 1.2rem;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
      justify-self: start;
    }
    button[type="submit"]:disabled {
      background: #b0c8e8;
      cursor: not-allowed;
    }
    button[type="submit"]:not(:disabled):hover { background: #357abd; }

    /* ── Book list ── */
    #list-section { margin-top: 2rem; max-width: 960px; }
    #list-section h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }

    #empty-msg { color: #888; font-size: 0.9rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      padding: 0.6rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }

    th { background: #f9f9f9; font-weight: 600; color: #555; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    /* Status select inside table */
    td select {
      padding: 0.2rem 0.4rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.82rem;
      background: #fff;
      cursor: pointer;
    }

    /* Inline date prompt row */
    tr.date-prompt-row td {
      background: #f0f6ff;
      border-bottom: 2px solid #4a90d9;
      padding: 0.6rem 0.8rem;
    }

    .date-prompt {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .date-prompt label { font-size: 0.85rem; font-weight: 600; color: #444; white-space: nowrap; }

    .date-prompt input[type="date"] {
      padding: 0.3rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.88rem;
    }

    .date-prompt button {
      padding: 0.3rem 0.8rem;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .date-prompt .btn-confirm {
      background: #4a90d9;
      color: #fff;
    }
    .date-prompt .btn-confirm:hover { background: #357abd; }
    .date-prompt .btn-confirm:disabled { background: #b0c8e8; cursor: not-allowed; }

    .date-prompt .btn-cancel {
      background: #eee;
      color: #444;
    }
    .date-prompt .btn-cancel:hover { background: #ddd; }

    .date-muted { color: #bbb; font-size: 0.85rem; }

    .star-display, .star-half, .star-empty { letter-spacing: -0.05em; }
    .star-display { color: #f5a623; }
    .star-half {
      background: linear-gradient(to right, #f5a623 50%, #ddd 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .star-empty { color: #ddd; }
  </style>
</head>
<body>

<h1>Reading Tracker</h1>

<!-- Stats -->
<div id="stats-section">
  <div class="stat-card">
    <div class="stat-value" id="stat-finished">0</div>
    <div class="stat-label">Finished this year</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="stat-pages">0</div>
    <div class="stat-label">Pages read this year</div>
  </div>
  <div class="stat-card breakdown">
    <div class="stat-value" id="stat-breakdown">—</div>
    <div class="stat-label">By status</div>
  </div>
</div>

<!-- Add form -->
<form id="add-form" novalidate>
  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" placeholder="Book title">
  </div>
  <div class="field">
    <label for="author">Author</label>
    <input type="text" id="author" placeholder="Author name">
  </div>
  <div class="field">
    <label for="page-count">Page count</label>
    <input type="number" id="page-count" min="1" placeholder="e.g. 320">
  </div>
  <div class="field">
    <label for="status">Status</label>
    <select id="status">
      <option value="want-to-read">Want to Read</option>
      <option value="reading">Reading</option>
      <option value="read">Read</option>
    </select>
  </div>

  <div class="field hidden" id="start-date-field">
    <label for="start-date">Date started</label>
    <input type="date" id="start-date">
  </div>

  <div class="field hidden" id="finish-date-field">
    <label for="finish-date">Date finished</label>
    <input type="date" id="finish-date">
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="already-read">
    <label for="already-read">Mark as already read</label>
  </div>

  <div class="field" id="rating-field">
    <label>Rating</label>
    <div class="star-rating" id="star-rating"></div>
    <span class="rating-hint">Optional — click a star to rate</span>
  </div>

  <div id="error-msg"></div>

  <button type="submit" id="add-btn" disabled>Add book</button>
</form>

<!-- Book list -->
<section id="list-section">
  <h2>My Books</h2>
  <p id="empty-msg">No books added yet.</p>
  <table id="book-table" style="display:none">
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Pages</th>
        <th>Status</th>
        <th>Started</th>
        <th>Finished</th>
        <th>Rating</th>
      </tr>
    </thead>
    <tbody id="book-tbody"></tbody>
  </table>
</section>

<script>
  const STORAGE_KEY = 'books';
  const THIS_YEAR = new Date().getFullYear();

  // ── Storage ────────────────────────────────────────────────────────────────
  function loadBooks() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveBooks(books) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
  }

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const form            = document.getElementById('add-form');
  const titleInput      = document.getElementById('title');
  const authorInput     = document.getElementById('author');
  const pagesInput      = document.getElementById('page-count');
  const statusSel       = document.getElementById('status');
  const startDateField  = document.getElementById('start-date-field');
  const finishDateField = document.getElementById('finish-date-field');
  const startDateInput  = document.getElementById('start-date');
  const finishDateInput = document.getElementById('finish-date');
  const alreadyRead     = document.getElementById('already-read');
  const ratingField     = document.getElementById('rating-field');
  const addBtn          = document.getElementById('add-btn');
  const errorMsg        = document.getElementById('error-msg');
  const emptyMsg        = document.getElementById('empty-msg');
  const bookTable       = document.getElementById('book-table');
  const bookTbody       = document.getElementById('book-tbody');

  // ── Star rating widget ─────────────────────────────────────────────────────
  const starContainer = document.getElementById('star-rating');
  let selectedRating = 0;

  for (let i = 1; i <= 5; i++) {
    const star = document.createElement('span');
    star.className = 'star';
    star.textContent = '★';
    star.dataset.state = 'empty';

    const left = document.createElement('span');
    left.className = 'zone left';
    left.dataset.val = String(i - 0.5);

    const right = document.createElement('span');
    right.className = 'zone right';
    right.dataset.val = String(i);

    star.appendChild(left);
    star.appendChild(right);
    starContainer.appendChild(star);
  }

  function highlightStars(rating) {
    starContainer.querySelectorAll('.star').forEach((star, idx) => {
      const n = idx + 1;
      if (rating >= n)             star.dataset.state = 'full';
      else if (rating >= n - 0.5)  star.dataset.state = 'half';
      else                         star.dataset.state = 'empty';
    });
  }

  starContainer.addEventListener('mouseover', e => {
    const zone = e.target.closest('.zone');
    if (zone) highlightStars(parseFloat(zone.dataset.val));
  });

  starContainer.addEventListener('mouseleave', () => {
    highlightStars(selectedRating);
  });

  starContainer.addEventListener('click', e => {
    const zone = e.target.closest('.zone');
    if (zone) {
      selectedRating = parseFloat(zone.dataset.val);
      highlightStars(selectedRating);
    }
  });

  function resetStars() {
    selectedRating = 0;
    highlightStars(0);
  }

  // ── Add-button gate ────────────────────────────────────────────────────────
  function updateAddBtn() {
    const baseOk = titleInput.value.trim() !== ''
                && authorInput.value.trim() !== ''
                && pagesInput.value.trim() !== ''
                && parseInt(pagesInput.value, 10) >= 1;

    let datesOk = true;
    if (!alreadyRead.checked) {
      if (statusSel.value === 'reading') {
        datesOk = startDateInput.value !== '';
      } else if (statusSel.value === 'read') {
        datesOk = finishDateInput.value !== '';
      }
    }

    addBtn.disabled = !(baseOk && datesOk);
  }

  // ── Sync form fields ───────────────────────────────────────────────────────
  function syncFormFields() {
    const checked = alreadyRead.checked;
    const status  = checked ? 'read' : statusSel.value;

    // Status select
    statusSel.disabled = checked;
    if (checked) statusSel.value = 'read';

    // Date fields
    if (checked) {
      startDateField.classList.remove('hidden');
      finishDateField.classList.remove('hidden');
    } else if (status === 'reading') {
      startDateField.classList.remove('hidden');
      finishDateField.classList.add('hidden');
      finishDateInput.value = '';
    } else if (status === 'read') {
      startDateField.classList.add('hidden');
      startDateInput.value = '';
      finishDateField.classList.remove('hidden');
    } else {
      startDateField.classList.add('hidden');
      startDateInput.value = '';
      finishDateField.classList.add('hidden');
      finishDateInput.value = '';
    }

    // Rating
    if (status === 'read') {
      ratingField.classList.add('visible');
    } else {
      ratingField.classList.remove('visible');
      resetStars();
    }

    updateAddBtn();
  }

  statusSel.addEventListener('change', syncFormFields);
  alreadyRead.addEventListener('change', syncFormFields);
  startDateInput.addEventListener('input', updateAddBtn);
  finishDateInput.addEventListener('input', updateAddBtn);
  [titleInput, authorInput, pagesInput].forEach(el =>
    el.addEventListener('input', updateAddBtn)
  );

  // ── Form submit ────────────────────────────────────────────────────────────
  form.addEventListener('submit', e => {
    e.preventDefault();

    const title      = titleInput.value.trim();
    const author     = authorInput.value.trim();
    const pages      = parseInt(pagesInput.value, 10);
    const status     = alreadyRead.checked ? 'read' : statusSel.value;
    const startDate  = startDateInput.value  || null;
    const finishDate = finishDateInput.value || null;
    const rating     = (status === 'read' && selectedRating > 0) ? selectedRating : null;

    const books = loadBooks();

    const isDuplicate = books.some(b =>
      b.title.toLowerCase()  === title.toLowerCase() &&
      b.author.toLowerCase() === author.toLowerCase()
    );

    if (isDuplicate) {
      showError('This book is already in your list.');
      return;
    }

    clearError();
    books.push({ title, author, pageCount: pages, status, rating, startDate, finishDate });
    saveBooks(books);
    renderList(books);
    renderStats(books);
    form.reset();
    resetStars();
    syncFormFields();
    updateAddBtn();
  });

  // ── Error helpers ──────────────────────────────────────────────────────────
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }

  function clearError() {
    errorMsg.textContent = '';
    errorMsg.classList.remove('visible');
  }

  // ── Stats ──────────────────────────────────────────────────────────────────
  function renderStats(books) {
    const finished = books.filter(b =>
      b.status === 'read' &&
      b.finishDate &&
      new Date(b.finishDate).getFullYear() === THIS_YEAR
    );

    document.getElementById('stat-finished').textContent = finished.length;
    document.getElementById('stat-pages').textContent =
      finished.reduce((sum, b) => sum + (b.pageCount || 0), 0).toLocaleString();

    const counts = { 'want-to-read': 0, 'reading': 0, 'read': 0 };
    books.forEach(b => { if (counts[b.status] !== undefined) counts[b.status]++; });

    document.getElementById('stat-breakdown').innerHTML =
      `Want to Read: <strong>${counts['want-to-read']}</strong><br>` +
      `Reading: <strong>${counts['reading']}</strong><br>` +
      `Read: <strong>${counts['read']}</strong>`;
  }

  // ── Render list ────────────────────────────────────────────────────────────
  const STATUS_LABELS = {
    'want-to-read': 'Want to Read',
    'reading':      'Reading',
    'read':         'Read',
  };

  function renderStars(rating) {
    if (rating === null || rating === undefined) return '—';
    let html = '';
    for (let i = 1; i <= 5; i++) {
      if (rating >= i)             html += `<span class="star-display">&#9733;</span>`;
      else if (rating >= i - 0.5)  html += `<span class="star-half">&#9733;</span>`;
      else                         html += `<span class="star-empty">&#9733;</span>`;
    }
    return html;
  }

  function fmtDate(d) {
    if (!d) return '<span class="date-muted">—</span>';
    // Parse YYYY-MM-DD without timezone shift
    const [y, m, day] = d.split('-');
    return `${day}/${m}/${y}`;
  }

  function renderList(books) {
    if (books.length === 0) {
      emptyMsg.style.display = '';
      bookTable.style.display = 'none';
      return;
    }
    emptyMsg.style.display = 'none';
    bookTable.style.display = '';

    bookTbody.innerHTML = books.map((b, idx) => `
      <tr data-idx="${idx}">
        <td>${escHtml(b.title)}</td>
        <td>${escHtml(b.author)}</td>
        <td>${b.pageCount}</td>
        <td>
          <select onchange="handleStatusChange(${idx}, this.value, this)">
            <option value="want-to-read"${b.status === 'want-to-read' ? ' selected' : ''}>Want to Read</option>
            <option value="reading"${b.status === 'reading' ? ' selected' : ''}>Reading</option>
            <option value="read"${b.status === 'read' ? ' selected' : ''}>Read</option>
          </select>
        </td>
        <td>${fmtDate(b.startDate)}</td>
        <td>${fmtDate(b.finishDate)}</td>
        <td>${renderStars(b.rating)}</td>
      </tr>
    `).join('');
  }

  // ── Inline status change ───────────────────────────────────────────────────
  function handleStatusChange(idx, newStatus, selectEl) {
    const books     = loadBooks();
    const book      = books[idx];
    const oldStatus = book.status;

    if (newStatus === oldStatus) return;

    // Remove any existing prompt row before showing a new one
    removePromptRow();

    const statusOrder = { 'want-to-read': 0, 'reading': 1, 'read': 2 };
    const isBackward  = statusOrder[newStatus] < statusOrder[oldStatus];

    if (isBackward) {
      book.status     = newStatus;
      book.finishDate = null;
      book.rating     = null;
      if (newStatus === 'want-to-read') book.startDate = null;
      books[idx] = book;
      saveBooks(books);
      renderList(books);
      renderStats(books);
      return;
    }

    // Forward move — determine which date is needed
    const needsStartDate  = newStatus === 'reading';
    const needsFinishDate = newStatus === 'read';

    const bookRow = bookTbody.querySelector(`tr[data-idx="${idx}"]`);
    const promptRow = document.createElement('tr');
    promptRow.className = 'date-prompt-row';

    const promptLabel = needsStartDate  ? 'Date started:'
                      : needsFinishDate ? 'Date finished:' : '';

    promptRow.innerHTML = `
      <td colspan="7">
        <div class="date-prompt">
          <label>${promptLabel}</label>
          <input type="date" id="prompt-date">
          <button class="btn-confirm" id="prompt-confirm" disabled>Confirm</button>
          <button class="btn-cancel" id="prompt-cancel">Cancel</button>
        </div>
      </td>
    `;

    bookRow.insertAdjacentElement('afterend', promptRow);

    const promptDateInput = document.getElementById('prompt-date');
    const promptConfirm   = document.getElementById('prompt-confirm');
    const promptCancel    = document.getElementById('prompt-cancel');

    promptDateInput.focus();

    promptDateInput.addEventListener('input', () => {
      promptConfirm.disabled = promptDateInput.value === '';
    });

    promptConfirm.addEventListener('click', () => {
      if (!promptDateInput.value) return;
      book.status = newStatus;
      if (needsStartDate)  book.startDate  = promptDateInput.value;
      if (needsFinishDate) book.finishDate = promptDateInput.value;
      books[idx] = book;
      saveBooks(books);
      removePromptRow();
      renderList(books);
      renderStats(books);
    });

    promptCancel.addEventListener('click', () => {
      // Revert the select to the old status
      selectEl.value = oldStatus;
      removePromptRow();
    });
  }

  function removePromptRow() {
    const existing = bookTbody.querySelector('.date-prompt-row');
    if (existing) existing.remove();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  const books = loadBooks();
  renderStats(books);
  renderList(books);
</script>
</body>
</html>
